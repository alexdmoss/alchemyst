[project]
name = "alchemyst"
version = "0.1.0"
description = "My university chemistry notes, on the internet"
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "cryptography==50.0.2",
    "dacite==1.9.2",
    "flask==3.1.3",
    "flask-caching==2.5.1",
    "flask-compress==1.25",
    "flask-wtf==1.3.0",
    "google-cloud==0.34.0",
    "google-cloud-datastore==2.27.0",
    "google-cloud-storage==3.17.1",
    "gunicorn==26.2.0",
    "prometheus-flask-exporter==0.23.2",
    "pyyaml==6.0.3",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "beautifulsoup4==4.15.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "pytest-socket==0.8.1",
    "pytest-timeout==2.4.0",
    "pytest-watch==4.2.0",
    "ruff==0.17.3",
]

[project.scripts]
alchemyst = "alchemyst:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
