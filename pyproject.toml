[project]
name = "alchemyst"
version = "0.1.0"
description = "My university chemistry notes, on the internet"
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "cryptography>=49.0.0",
    "dacite>=1.9.2",
    "flask>=3.1.3",
    "flask-caching>=2.4.0",
    "flask-compress>=1.24",
    "flask-wtf>=1.3.0",
    "google-cloud>=0.34.0",
    "google-cloud-datastore>=2.25.0",
    "google-cloud-storage>=3.12.0",
    "gunicorn>=26.0.0",
    "prometheus-flask-exporter>=0.23.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-socket>=0.8.0",
    "pytest-timeout>=2.4.0",
    "pytest-watch>=4.2.0",
    "ruff>=0.15.19",
]

[project.scripts]
alchemyst = "alchemyst:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
